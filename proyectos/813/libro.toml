sinopsis = "París, Palace Hotel. El magnate Rodolfo Kesselbach aparece asesinado en su suite. Junto al cadáver, una cigarrera con dos iniciales, «L. M.», y en su agenda una cifra que nadie sabe descifrar: 813.\n\nArsène Lupin solo había ido a robarle. Ahora es el principal sospechoso de un crimen que no ha cometido, y el asesino, un hombre vestido de negro al que nadie ha visto el rostro, va siempre un paso por delante.\n\nPara alcanzarlo, Lupin tendrá que desdoblarse en el príncipe Sernine y en el jefe de la Sûreté, el señor Lenormand, y asomarse a un secreto que afecta a los tronos de Europa. Es la aventura más sombría del caballero ladrón: la primera en que Lupin pierde."
cita = "Cuando Lupin dice una cosa, ésta se cumple."
