sinopsis = "Primavera de 1912. En el Bugey, al pie del Jura, empiezan a desaparecer cosas: las agujas de un reloj, una bandera, un gallo de campanario, una estatua de jardín. Nadie ve a los ladrones; no dejan huellas, y todo lo que se llevan estaba al aire libre y en alto. Los campesinos los llaman *sarvants*: duendes, aparecidos.\n\nUn día dejan de llevarse cosas y empiezan a llevarse personas.\n\nMaurice Renard, maestro de lo «maravilloso científico», convierte una crónica de pueblo en una pesadilla de escala planetaria. Publicada en 1911 y traducida ahora por primera vez al español, *El peligro azul* es una novela de humor, de suspense y de vértigo cósmico sobre lo que no vemos."
cita = "«Mirad. Luego reflexionad. Luego soñad. Esto no es imposible»."
