sinopsis = "Un marinero a la deriva sobre un fango que no debería existir. Un bajorrelieve de arcilla modelado en sueños. Un joven de Providence que busca a un antepasado y encuentra algo que no estaba muerto. Una aldea de las colinas donde nace lo que no tiene forma. Una expedición a la Antártida que descubre que no fuimos los primeros. Un pueblo costero que oculta su sangre.\n\nEste volumen reúne en un solo libro los nueve textos de H. P. Lovecraft publicados en la colección Límite Abisal, en traducción de El Gabinete Negro y ordenados según fueron escritos: el camino completo, de «Dagón» a *La sombra sobre Innsmouth*, por el que el horror sobrenatural se convirtió en horror cósmico."
cita = "«No está muerto lo que yace eternamente, y con el paso de los evos, incluso la muerte puede morir»."
