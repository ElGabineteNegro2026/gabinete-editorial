sinopsis = "Un soldado que se desnuda en un cementerio a la luz de la luna. Un caballero bretón al que su esposa roba la ropa. Un pastor de trece años que confiesa ante el Parlamento de Burdeos. Una madrastra hermosa que sale de noche en camisón y vuelve con las manos sucias. Una vieja que aúlla en la nieve de la Selva Negra. Un muchacho que toma el sol desnudo junto al río y que, cuando le preguntan de qué se alimenta, responde con toda naturalidad.\n\nTrece textos, de la Roma de Nerón a la Inglaterra eduardiana, reúnen la gran tradición literaria del hombre lobo: leyendas medievales, actas de los procesos de licantropía, cuentos góticos victorianos y relatos de Marryat, Erckmann-Chatrian, Bierce y Saki, en nueva traducción de El Gabinete Negro, con prólogo y apéndice. Antes de la luna llena y de la bala de plata, el hombre lobo era el vecino, el marido, la esposa: alguien que guardaba un secreto."

