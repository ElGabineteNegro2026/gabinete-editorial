sinopsis = "Una casa de Londres en la que nadie consigue pasar la noche. Una habitación que desaparece en cuanto su dueño la abandona. Un muñeco de ojos demasiado vivos. Una muchacha pálida que llega una noche al castillo y ya no se marcha. Un papel pintado en el que alguien se mueve. Algo invisible que respira junto a la cama.\n\nDieciséis relatos y una novela breve, de Hoffmann a Bierce, que recorren el gran siglo del terror gótico y sobrenatural: el romanticismo alemán, las leyendas de Bécquer, la *ghost story* victoriana, la locura de Maupassant y la sombra americana. Puertas cerradas, cuartos prohibidos, casas que recuerdan. En la Cámara Sellada, el horror no grita: susurra."
